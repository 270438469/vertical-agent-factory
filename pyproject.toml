[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vertical-agent-factory"
version = "0.3.0"
description = "Capability-first runtime and validator for vertical agent domain packages"
requires-python = ">=3.7"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
api = [
  "fastapi>=0.115.12,<0.116",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<0.35",
]
api-test = [
  "httpx>=0.27,<0.29",
  "pytest>=7,<9",
]

[project.scripts]
vertical-agent = "vertical_agent_factory.cli:main"
vertical-agent-api = "vertical_agent_factory.commercial.app:run"

[tool.setuptools.packages.find]
include = ["vertical_agent_factory*"]
