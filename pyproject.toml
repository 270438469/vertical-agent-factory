[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vertical-agent-factory"
version = "0.1.0"
description = "Capability-first runtime and validator for vertical agent domain packages"
requires-python = ">=3.7"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
vertical-agent = "vertical_agent_factory.cli:main"

[tool.setuptools.packages.find]
include = ["vertical_agent_factory*"]
